name: currency
description: A simple Indian cash counting calculator.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/currency_logo.png

flutter_launcher_icons:
  android: launcher_icon
  ios: true
  image_path: assets/images/currency_logo.png
  adaptive_icon_background: '#14382F'
  adaptive_icon_foreground: assets/images/currency_logo.png
  remove_alpha_ios: true
